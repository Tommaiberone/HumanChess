[project]
name = "smartchess"
version = "0.1.0"
description = "Human-aware chess game review: best move, simplest move and trickiest move within a small margin"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.11",
    "maia3 @ git+https://github.com/CSSLab/maia3",
    "torch>=2.4",
    "numpy>=2.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[tool.uv.sources]
# CPU-only wheels on Linux: the project never uses a GPU, and the PyPI ones pull in
# several GB of CUDA libraries.
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
smartchess = "smartchess.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
# The AWS Lambda package (scripts/build_lambda.py): no torch or maia3, Maia-3 runs on
# numpy there, and boto3 comes with the Lambda runtime.
lambda = ["chess>=1.11", "fastapi>=0.110", "mangum>=0.17", "numpy>=2.0", "requests>=2.31"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartchess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
