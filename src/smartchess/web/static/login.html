<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HumanChess</title>
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/"><span class="logo-mark">♞</span>HumanChess</a>
  </header>
  <main>
    <form class="card login" method="post" action="/login">
      <h1>Sign in</h1>
      <p class="muted">This copy of HumanChess is private.</p>
      <!-- The username lets password managers save and fill the password. -->
      <input type="text" name="username" value="smartchess" autocomplete="username" hidden>
      <label class="login-field">
        <span>Password</span>
        <input class="input" id="password" type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <p class="error" id="wrong" hidden>Wrong password: try again.</p>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </main>
  <script>
    if (new URLSearchParams(location.search).has('wrong')) document.getElementById('wrong').hidden = false;
  </script>
</body>
</html>
